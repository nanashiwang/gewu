<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}格物 · AI API 中转站检测工具{% endblock %}</title>
  <meta name="description" content="{% block description %}免费在线检测 AI API 中转站质量。Claude 支持 thinking signature 原始/篡改双向回放验证,OpenAI 支持 Chat Completions 行为/协议级检测。{% endblock %}" />
  <meta name="keywords" content="AI API 中转站检测, Claude API 中转站, OpenAI 中转站检测, Gemini 中转站检测, API 中转站真伪, Claude thinking signature, API relay verification" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% block og_title %}格物 · AI API 中转站检测{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}Claude 签名回放验证与 OpenAI Chat Completions 检测已上线。{% endblock %}" />
  <meta property="og:url" content="{% block og_url %}{{ brand.url('/') }}{% endblock %}" />
  <meta property="og:locale" content="zh_CN" />
  <meta name="twitter:card" content="summary_large_image" />
  {% block og_image %}{% endblock %}
  <link rel="canonical" href="{% block canonical %}{{ brand.url('/') }}{% endblock %}" />
  <link rel="stylesheet" href="/static/style.css?v=20261012-task-state" />
  <link rel="stylesheet" href="/static/interface.css?v=20261012-evidence-catalog" />
  <link rel="stylesheet" href="/static/scope.css?v=20261014-1" />
  <link rel="icon" href="/static/favicon.svg?v=20261011-4" type="image/svg+xml" />
  {% block head_extra %}{% endblock %}
  {% if brand.analytics_id %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ brand.analytics_id | e }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', {{ brand.analytics_id | tojson }});
  </script>
  {% endif %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="/" aria-label="{{ brand.name }}首页">
        <img class="brand-symbol" src="/static/favicon.svg?v=20261011-4" width="36" height="36" alt="" />
        <span class="brand-wordmark">{{ brand.name }}<small>有据可验</small></span>
      </a>
      <button
        class="nav-toggle"
        type="button"
        aria-label="打开菜单"
        aria-expanded="false"
        aria-controls="site-nav">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="主导航">
        {% set path = request.url.path %}
        <a href="/" {% if path in ["/", "/claude", "/openai", "/gemini"] %}aria-current="page"{% endif %}>检测</a>
        <a href="/leaderboard" {% if path.startswith("/leaderboard") and path != "/leaderboard/monitor" %}aria-current="page"{% endif %}>质量榜</a>
        <a href="/leaderboard/monitor" {% if path == "/leaderboard/monitor" %}aria-current="page"{% endif %}>模型观测</a>
        <a href="/pricing" {% if path == "/pricing" %}aria-current="page"{% endif %}>模型价格</a>
        <a href="/faq" {% if path == "/faq" %}aria-current="page"{% endif %}>帮助</a>
        <a class="nav-login" href="/login">登录</a>
        <a class="nav-register" href="/register">注册</a>
      </nav>
    </div>
  </header>
  <main class="container" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer footer-compact">
    <div class="footer-compact-inner">
      <span>© {{ brand.name }} · 公益检测 · 结果可复核</span>
      <nav aria-label="页脚"><a href="/#security-and-trust">检测与隐私</a><a href="/leaderboard/sources">外部状态与基线</a><a href="/faq">常见问题</a></nav>
    </div>
  </footer>
  <script src="/static/app.js?v=20261014-scope" defer></script>
  <script src="/static/select.js?v=20261011-4" defer></script>
  <script src="/static/scope.js?v=20261014-2" defer></script>
</body>
</html>
