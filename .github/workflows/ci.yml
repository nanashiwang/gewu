name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detector:
    name: detector tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            detector/pyproject.toml
            detector/constraints.txt
      - name: Install detector dependencies
        run: python -m pip install -c detector/constraints.txt -e "./detector[dev,web]"
      - name: Test detector
        run: python -m pytest -q detector/tests

  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint guardrails
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payload
          POSTGRES_PASSWORD: payload
          POSTGRES_DB: gewu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payload -d gewu"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://payload:payload@localhost:5432/gewu
      PAYLOAD_SECRET: ci-secret-32-bytes-long-enough
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify additive interface migration
        run: npx tsx scripts/test-relay-wire-api-migration.ts
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SERVER_URL: https://gewu.uk
        run: npm run build
      - name: Prepare disposable database for account container acceptance
        env:
          NODE_ENV: development
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          timeout --kill-after=10s 150s npx tsx scripts/prepare-platform-ci.ts
          docker exec "$POSTGRES_CONTAINER" pg_dump -U payload -d gewu --format=custom --no-owner --no-acl > platform-ci-database.dump
      - name: Package Linux release
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r docs .next/standalone/docs
          mkdir -p .next/standalone/scripts
          cp scripts/relay-cron.mjs .next/standalone/scripts/relay-cron.mjs
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/.deployed-commit
          tar -czf gewu-platform-linux.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: gewu-platform-${{ github.sha }}
          path: gewu-platform-linux.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gewu-platform-ci-${{ github.sha }}
          path: |
            platform-ci-database.dump
            platform-schema.json
          retention-days: 1

  detector-image-compatibility:
    name: Docker 29 image store (${{ matrix.store }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: classic
            containerd: false
          - store: containerd
            containerd: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: v29.4.1
          daemon-config: |
            {"features": {"containerd-snapshotter": ${{ matrix.containerd }}}}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify pinned pull and checked archive across stores
        env:
          IMAGE_STORE: ${{ matrix.store }}
        run: python3 detector/deploy/test_image_store_compatibility.py
      - name: Verify no temporary test containers remain
        if: always()
        run: |
          set -euo pipefail
          name=gewu-detector-release-smoke
          if docker inspect "$name" >/dev/null 2>&1; then
            test "$(docker inspect --format '{{index .Config.Labels "org.gewu.component"}}' "$name")" = detector
            docker rm -f "$name"
          fi
          test -z "$(docker ps -aq --filter name='^/gewu-detector-release-smoke$')"
          echo 'GEWU_LEFTOVER_TEST_CONTAINERS=0'

  detector-image:
    name: detector container + release
    needs: [detector, verify, build, detector-image-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    concurrency:
      group: detector-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build detector image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./detector
          file: ./detector/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/nanashiwang/gewu-detector:${{ github.sha }}
          build-args: GEWU_RELEASE_ID=${{ github.sha }}
          cache-from: type=gha,scope=gewu-detector
          cache-to: type=gha,mode=max,scope=gewu-detector
      - name: Test actual image without upstream network access
        env:
          IMAGE: ghcr.io/nanashiwang/gewu-detector:${{ github.sha }}
        run: |
          python3 - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('release', 'detector/deploy/container_release.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.smoke_image(os.environ['IMAGE'], 10001, 10001)
          PY
          docker run --rm --network none --read-only --entrypoint python "$IMAGE" -c \
            'from pathlib import Path; import os; from relay_detector.baselines import ROOT; assert str(ROOT)=="/opt/gewu-detector/data/baselines"; assert not list(ROOT.iterdir()); assert not list(Path("web_data/jobs").iterdir()); assert not Path("private_monitor").exists(); assert not Path(".env").exists(); assert os.getuid()!=0'
      - name: Exercise real systemd migration and rollback on the isolated runner
        env:
          IMAGE: ghcr.io/nanashiwang/gewu-detector:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,IMAGE,REVISION python3 detector/deploy/test_container_migration.py
      - name: Download the tested Linux account bundle
        uses: actions/download-artifact@v4
        with:
          name: gewu-platform-${{ github.sha }}
          path: platform-bundle
      - name: Download the disposable account database fixture
        uses: actions/download-artifact@v4
        with:
          name: gewu-platform-ci-${{ github.sha }}
          path: platform-fixture
      - name: Package account runtime image without rebuilding application code
        env:
          REVISION: ${{ github.sha }}
        run: |
          mkdir platform-runtime
          tar -xzf platform-bundle/gewu-platform-linux.tar.gz -C platform-runtime
          test "$(cat platform-runtime/.deployed-commit)" = "$REVISION"
          docker build --platform linux/amd64 --build-arg GEWU_RELEASE_ID="$REVISION" \
            -f deploy/platform/Dockerfile -t "ghcr.io/nanashiwang/gewu-platform:$REVISION" platform-runtime
      - name: Verify real paired cutover, copied database and rollback on the isolated runner
        env:
          IMAGE: ghcr.io/nanashiwang/gewu-detector:${{ github.sha }}
          PLATFORM_IMAGE: ghcr.io/nanashiwang/gewu-platform:${{ github.sha }}
          REVISION: ${{ github.sha }}
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,IMAGE,PLATFORM_IMAGE,REVISION python3 deploy/platform/test_container_migration.py
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image and anonymous-download release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          IMAGE: ghcr.io/nanashiwang/gewu-detector:${{ github.sha }}
        run: |
          set -euo pipefail
          release_exists=false
          if gh release view "detector-${REVISION}" --json isDraft --jq .isDraft > /tmp/gewu-release-draft; then
            if test "$(cat /tmp/gewu-release-draft)" = false; then
              echo 'This commit already has an immutable published release; keeping its original image and assets.'
              exit 0
            fi
            release_exists=true
          fi
          docker push "$IMAGE"
          mkdir release-detector
          docker save "$IMAGE" | gzip > release-detector/detector-image.tar.gz
          cp detector/deploy/container_release.py release-detector/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', os.environ['IMAGE']]))[0]
          digest = next(d for d in info['RepoDigests'] if d.startswith('ghcr.io/nanashiwang/gewu-detector@sha256:'))
          archive = pathlib.Path('release-detector/detector-image.tar.gz')
          data = {'revision': os.environ['REVISION'], 'platform': 'linux/amd64',
                  'image': digest, 'image_id': info['Id'],
                  'archive_sha256': hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest()}
          pathlib.Path('release-detector/release.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          printf '%s\n' '经完整 CI 与隔离容器检查的格物检测服务。服务器按提交版本和 SHA256 校验部署。镜像不包含服务器密钥、报告或私有基线。共享服务器请先更新配套账号平台；部署预检会核对报告访问能力及内部认证，避免只更新检测站。' > release-detector/notes.md
          if test "$release_exists" = false; then
            gh release create "detector-${REVISION}" --draft \
              --target "$REVISION" --title "检测服务容器发布 ${REVISION:0:12}" \
              --notes-file release-detector/notes.md --latest=false
          fi
          gh release upload "detector-${REVISION}" --clobber \
            release-detector/detector-image.tar.gz release-detector/release.json release-detector/container_release.py
          gh release edit "detector-${REVISION}" --draft=false --latest=false
      - name: Publish the paired account image and checked deployer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
          PLATFORM_IMAGE: ghcr.io/nanashiwang/gewu-platform:${{ github.sha }}
        run: |
          set -euo pipefail
          release_exists=false
          if gh release view "platform-${REVISION}" --json isDraft --jq .isDraft > /tmp/gewu-platform-release-draft; then
            if test "$(cat /tmp/gewu-platform-release-draft)" = false; then
              echo 'An immutable platform release already exists; retaining its assets.'
              exit 0
            fi
            release_exists=true
          fi
          docker push "$PLATFORM_IMAGE"
          mkdir release-platform
          docker save "$PLATFORM_IMAGE" | gzip > release-platform/platform-image.tar.gz
          cp deploy/platform/container_release.py release-platform/
          cp platform-fixture/platform-schema.json release-platform/schema.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def sha(path):
              return hashlib.file_digest(pathlib.Path(path).open('rb'), 'sha256').hexdigest()
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', os.environ['PLATFORM_IMAGE']]))[0]
          digest = next(x for x in info['RepoDigests'] if x.startswith('ghcr.io/nanashiwang/gewu-platform@sha256:'))
          data = {'revision': os.environ['REVISION'], 'platform': 'linux/amd64',
                  'image': digest, 'image_id': info['Id'],
                  'archive_sha256': sha('release-platform/platform-image.tar.gz'),
                  'schema_sha256': sha('release-platform/schema.json'),
                  'detector_revision': os.environ['REVISION'],
                  'detector_script_sha256': sha('detector/deploy/container_release.py')}
          pathlib.Path('release-platform/release.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
          printf '%s\n' '由同一 GitHub CI 构建并验收的格物账号平台镜像。部署脚本校验两个固定镜像与数据库副本，先更新账号后台再更新检测站；保留配置、媒体、数据库和其他项目，不执行服务器构建、数据库迁移或缓存清理。' > release-platform/notes.md
          if test "$release_exists" = false; then
            gh release create "platform-${REVISION}" --draft --target "$REVISION" \
              --title "格物账号容器配套发布 ${REVISION:0:12}" --notes-file release-platform/notes.md --latest=false
          fi
          gh release upload "platform-${REVISION}" --clobber release-platform/platform-image.tar.gz \
            release-platform/release.json release-platform/schema.json release-platform/container_release.py
          gh release edit "platform-${REVISION}" --draft=false --latest=false
      - name: Ensure paired platform test resources have ended
        if: always()
        run: sudo python3 deploy/platform/test_container_migration.py --cleanup
      - name: Ensure no temporary detector test containers remain
        if: always()
        run: |
          set -euo pipefail
          if test -f /tmp/gewu-container-ci-owned; then
            sudo systemctl stop gewu.service
          fi
          for name in gewu-detector-release-smoke gewu-detector; do
            if docker inspect "$name" >/dev/null 2>&1; then
              test "$(docker inspect --format '{{index .Config.Labels "org.gewu.component"}}' "$name")" = detector
              docker rm -f "$name"
            fi
          done
          test -z "$(docker ps -aq --filter name='^/gewu-detector-release-smoke$' --filter name='^/gewu-detector$')"
          echo 'GEWU_LEFTOVER_TEST_CONTAINERS=0'
